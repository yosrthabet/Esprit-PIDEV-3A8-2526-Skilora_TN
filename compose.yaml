services:
  database:
    image: mariadb:10.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-skilorafinal}
      MYSQL_USER: ${MYSQL_USER:-skilora_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-SkiloraLocal_2026_Strong!}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - database_data:/var/lib/mysql:rw
      - ./docker/mariadb/skilora-dev.cnf:/etc/mysql/conf.d/skilora-dev.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      timeout: 5s
      retries: 10
      start_period: 30s

  mailer:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  database_data:
